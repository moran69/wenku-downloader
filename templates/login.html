<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文库下载器 · 登录</title>
<style>
  :root { --brand:#4f46e5; --brand2:#7c3aed; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  }
  .card {
    background:#fff; border-radius:16px; padding:40px 36px; width:360px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .logo { text-align:center; margin-bottom:24px; }
  .logo .icon { font-size:42px; }
  .logo h1 { font-size:20px; color:#1f2937; margin-top:8px; font-weight:700; }
  .logo p { font-size:13px; color:#9ca3af; margin-top:4px; }
  label { display:block; font-size:13px; color:#4b5563; margin-bottom:6px; font-weight:600; }
  input {
    width:100%; padding:12px 14px; border:1.5px solid #e5e7eb; border-radius:10px;
    font-size:15px; transition:.2s; outline:none;
  }
  input:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(79,70,229,.12); }
  button {
    width:100%; margin-top:18px; padding:13px; border:none; border-radius:10px;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    color:#fff; font-size:15px; font-weight:600; cursor:pointer; transition:.2s;
  }
  button:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(79,70,229,.35); }
  .err { color:#ef4444; font-size:13px; text-align:center; margin-top:12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="icon">📚</div>
      <h1>百度文库下载器</h1>
      <p>请输入访问密码</p>
    </div>
    <form method="post">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" placeholder="请输入访问密码" autofocus required>
      <button type="submit">进 入</button>
    </form>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </div>
</body>
</html>
